<title>bonsai</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: summary first, then a decide column (calls, ready groups, keeps) beside a live track-changes preview of the result. A thumb-zone dock holds the one way out. */
  /*__BLUEPRINT_TOKENS__*/
  :root {
    --sunk: color-mix(in srgb, var(--hair) 60%, var(--surface));
    --accent-ink: light-dark(#ffffff, #0e1424);
    --del-bg: light-dark(#fbe8e5, #371c19);
    --del-ink: light-dark(#8a2a1e, #f1b2a7);
    --del-mark: light-dark(#f3bfb5, #6a2a21);
    --ins-bg: light-dark(#e2f1e6, #142c1d);
    --ins-ink: light-dark(#1b5631, #a8dcb6);
    --ins-mark: light-dark(#acdab9, #2a5c3a);
    --call: light-dark(#8a5600, #f0c46b);
    --call-bg: light-dark(#fcf0d6, #30260f);
    --dock-h: 76px;
  }

  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  html,
  body {
    overflow-x: hidden;
  }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 20px 20px;
    background-position: 10px 10px;
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button,
  input,
  textarea,
  select {
    font: inherit;
    color: inherit;
  }
  a {
    color: var(--accent);
  }
  code {
    font: 0.86em var(--mono);
    /* Ligatures would draw -> and => as arrows the code does not hold. */
    font-variant-ligatures: none;
    background: var(--sunk);
    padding: 0.05em 0.3em;
    overflow-wrap: anywhere;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h1,
  h2,
  h3,
  h4 {
    margin: 0;
    text-wrap: balance;
    line-height: 1.2;
  }
  p {
    margin: 0;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px
      calc(var(--dock-h) + 48px + env(safe-area-inset-bottom, 0px));
  }
  .record .wrap {
    padding-block-end: 48px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--body);
    font-weight: 600;
  }
  .muted {
    /* Blueprint's --muted is too light for body text on --paper. */
    color: var(--body);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }

  /* summary */
  .summary {
    display: grid;
    gap: 14px;
    padding-block: 8px 22px;
    max-width: 780px;
  }
  .summary h1 {
    font: 600 clamp(1.9rem, 5.5vw, 2.6rem)/1.08 var(--sans);
    letter-spacing: -0.03em;
  }
  .summary h1 span {
    color: var(--body);
  }
  .outcome {
    font-size: 1.08rem;
    max-width: 60ch;
  }
  .status-banner {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    padding: 12px 14px;
    display: grid;
    gap: 4px;
  }
  .status-banner b {
    font-weight: 700;
  }
  .meter {
    display: grid;
    gap: 6px;
  }
  .meter .bar {
    position: relative;
    height: 14px;
    background: var(--surface);
    border: 1px solid var(--hair-strong);
    overflow: hidden;
  }
  .meter .keep {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .meter .cut {
    position: absolute;
    inset: 0 0 0 auto;
    background: repeating-linear-gradient(
      135deg,
      var(--del-mark) 0 4px,
      transparent 4px 8px
    );
    transition: width 0.25s ease;
  }
  .meter .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 0.9rem;
    color: var(--body);
  }
  .meter .legend b {
    color: var(--ink);
    font-weight: 600;
  }
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .fact {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--surface);
    border: 1px solid var(--hair-strong);
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .fact b {
    font-weight: 600;
  }
  .fact.callf {
    border-color: var(--call);
    color: var(--call);
    background: var(--call-bg);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
  }
  .btn {
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    padding: 8px 14px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    line-height: 1.2;
  }
  .btn:hover {
    border-color: var(--accent);
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.ghost {
    background: transparent;
  }
  .btn.small {
    padding: 5px 10px;
    font-size: 0.84rem;
  }

  /* tabs (narrow only) */
  .tabs {
    display: none;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 6;
    background: var(--paper);
    margin-inline: -16px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--hair-strong);
    gap: 6px;
  }
  .tabs button {
    flex: 1;
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    padding: 8px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* split */
  .split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 470px);
    gap: 28px;
    align-items: start;
  }
  .split.solo {
    grid-template-columns: minmax(0, 880px);
  }
  .decide {
    display: grid;
    gap: 30px;
    min-width: 0;
    counter-reset: lane;
  }
  .lane {
    display: grid;
    gap: 12px;
    min-width: 0;
  }
  .lane-head {
    display: grid;
    gap: 4px;
    counter-increment: lane;
  }
  .lane-head h2 {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .lane-head h2::before {
    content: counter(lane, decimal-leading-zero);
    color: var(--accent);
  }
  .lane-head .lede {
    color: var(--body);
    font-size: 0.95rem;
    max-width: 62ch;
  }
  .count {
    font: 600 0.78rem/1 var(--mono);
    letter-spacing: 0.04em;
    padding: 4px 8px;
    background: var(--sunk);
    color: var(--body);
  }
  .lane.call .count {
    background: var(--call-bg);
    color: var(--call);
  }

  /* cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--hair-strong);
    padding: 16px;
    display: grid;
    gap: 10px;
    min-width: 0;
    scroll-margin-top: 72px;
    transition: border-color 0.15s;
    position: relative;
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-color: var(--ink);
    border-style: solid;
    pointer-events: none;
  }
  .card::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
  }
  .card::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
  }
  .card.cur {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .card[data-state="apply"] {
    border-left: 4px solid var(--accent);
  }
  .card[data-state="skip"],
  .card[data-state="later"] {
    border-left: 4px solid var(--body);
  }
  .card[data-state="apply"]::before,
  .card[data-state="skip"]::before,
  .card[data-state="later"]::before {
    left: -4px;
  }
  .card[data-state="skip"] .diff,
  .card[data-state="later"] .diff {
    opacity: 0.55;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    font-size: 0.82rem;
    color: var(--body);
  }
  .verb {
    font: 600 0.7rem/1 var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 7px;
    background: var(--sunk);
    color: var(--ink);
  }
  .verb.fix,
  .verb.question {
    background: var(--call-bg);
    color: var(--call);
  }
  .verb.delete,
  .verb.shorten {
    background: var(--del-bg);
    color: var(--del-ink);
  }
  .verb.rewrite,
  .verb.move,
  .verb.automate {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .verb.add {
    background: var(--ins-bg);
    color: var(--ins-ink);
  }
  .loc {
    font-family: var(--mono);
    color: var(--body);
    text-decoration: none;
    border-bottom: 1px dotted var(--hair-strong);
  }
  a.loc:hover {
    color: var(--accent);
  }
  span.loc {
    border-bottom: 0;
  }
  .tok {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .split-vote {
    color: var(--call);
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .card h3 {
    font-size: 1.06rem;
    font-weight: 700;
  }
  .why {
    max-width: 68ch;
  }
  .ifskip {
    font-size: 0.92rem;
    color: var(--body);
    max-width: 68ch;
  }
  .ifskip b {
    color: var(--ink);
    font-weight: 600;
  }
  .check {
    font-size: 0.86rem;
    display: flex;
    gap: 6px;
    align-items: baseline;
    color: var(--ins-ink);
  }
  .check::before {
    content: "\2713";
    font-weight: 700;
  }
  .check.drift {
    color: var(--del-ink);
    background: var(--del-bg);
    padding: 6px 8px;
  }
  .check.drift::before {
    content: "!";
  }
  details.how > summary {
    cursor: pointer;
    color: var(--body);
    font-size: 0.88rem;
    width: max-content;
    max-width: 100%;
  }
  details.how > summary:hover {
    color: var(--ink);
  }
  details.how ul {
    margin: 6px 0 0;
    padding-left: 18px;
    color: var(--body);
    font-size: 0.9rem;
    display: grid;
    gap: 4px;
  }
  details.how a {
    font-size: 0.84rem;
  }

  /* guard candidates: what the review caught, the mistake, the check, its cost */
  .g-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
  }
  .badge {
    font: 600 0.7rem/1 var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 7px;
    white-space: nowrap;
  }
  .badge.recommended {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge.close-call {
    background: var(--call-bg);
    color: var(--call);
  }
  .badge.low-value {
    background: var(--sunk);
    color: var(--body);
  }
  .g-sec {
    display: grid;
    gap: 8px;
    min-width: 0;
    padding-top: 10px;
    border-top: 1px solid var(--hair);
  }
  .g-sec h4 {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    font: 600 0.72rem/1.3 var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--body);
  }
  .g-sec h4 span {
    font: 400 0.84rem var(--sans);
    letter-spacing: 0;
    text-transform: none;
  }
  .quotes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  .quotes blockquote {
    margin: 0;
    padding-left: 12px;
    border-left: 3px solid var(--hair-strong);
    max-width: 68ch;
  }
  .quotes cite {
    display: block;
    padding-left: 15px;
    font-style: normal;
    font-size: 0.82rem;
    color: var(--body);
  }
  .quotes cite b {
    font: 600 0.8rem var(--mono);
    color: var(--ink);
  }
  .pair {
    display: grid;
    gap: 8px;
  }
  .code {
    margin: 0;
    min-width: 0;
    border: 1px solid var(--hair-strong);
    background: var(--paper);
  }
  .code figcaption {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 10px;
    font: 600 0.7rem/1.4 var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--sunk);
    color: var(--body);
  }
  .code figcaption span {
    font-weight: 500;
    text-transform: none;
  }
  .code.wrong figcaption {
    background: var(--del-bg);
    color: var(--del-ink);
  }
  .code.right figcaption {
    background: var(--ins-bg);
    color: var(--ins-ink);
  }
  .code pre {
    margin: 0;
    padding: 8px 10px;
    overflow-x: auto;
    font: 0.8rem/1.55 var(--mono);
    font-variant-ligatures: none;
  }
  .code pre code {
    font: inherit;
    background: none;
    padding: 0;
    overflow-wrap: normal;
  }
  .code.msg pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .g-note {
    font-size: 0.9rem;
    color: var(--body);
    max-width: 68ch;
  }
  .kv {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  .kv th,
  .kv td {
    padding: 5px 0;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--hair);
  }
  .kv tr:last-child > * {
    border-bottom: 0;
  }
  .kv th {
    width: 36%;
    padding-right: 12px;
    font-weight: 500;
    color: var(--body);
  }
  .ships {
    color: var(--body);
    max-width: 68ch;
  }
  .ships b {
    color: var(--ink);
    font-weight: 600;
  }
  .held,
  .none-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  .held li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 12px;
    align-items: start;
  }
  .held li > div {
    display: grid;
    gap: 2px;
    min-width: 0;
  }
  .held .muted,
  .none-list .muted {
    font-size: 0.9rem;
  }
  .none-list li {
    display: grid;
    gap: 2px;
    font-size: 0.94rem;
  }

  /* diffs */
  .diff {
    border: 1px solid var(--hair-strong);
    overflow: hidden;
    font: 0.8rem/1.55 var(--mono);
    font-variant-ligatures: none;
    min-width: 0;
    position: relative;
  }
  .dl {
    display: grid;
    grid-template-columns: 2.6em minmax(0, 1fr);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .dl .g {
    color: var(--body);
    text-align: right;
    padding-right: 0.7em;
    user-select: none;
    -webkit-user-select: none;
    opacity: 0.8;
  }
  .dl .t {
    padding: 2px 10px 2px 0;
  }
  .dl.del {
    background: var(--del-bg);
    color: var(--del-ink);
  }
  .dl.ins {
    background: var(--ins-bg);
    color: var(--ins-ink);
  }
  .dl.del mark {
    background: var(--del-mark);
    color: inherit;
    text-decoration: line-through;
  }
  .dl.ins mark {
    background: var(--ins-mark);
    color: inherit;
  }
  .dl.ctx {
    color: var(--body);
    font-family: var(--sans);
    font-size: 0.78rem;
  }
  .dl.gap {
    color: var(--body);
  }
  .diff.clamp::after {
    content: "Tap to see all";
    position: absolute;
    inset: auto 0 0 0;
    padding: 18px 10px 4px;
    text-align: right;
    font: 600 0.74rem var(--sans);
    color: var(--body);
    background: linear-gradient(transparent, var(--surface) 70%);
  }

  /* decisions */
  .choice {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .choice button {
    flex: 1 1 0;
    min-width: 84px;
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    padding: 10px 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .choice button kbd {
    font: 500 0.7rem var(--mono);
    border: 1px solid var(--hair-strong);
    padding: 0 4px;
    color: var(--body);
    background: transparent;
  }
  .choice button[aria-pressed="true"][data-v="apply"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .choice button[aria-pressed="true"][data-v="skip"],
  .choice button[aria-pressed="true"][data-v="later"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .choice button[aria-pressed="true"] kbd {
    color: inherit;
    border-color: currentColor;
  }
  .options {
    display: grid;
    gap: 6px;
  }
  .option {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 2px 10px;
    align-items: start;
    padding: 10px 12px;
    border: 1px solid var(--hair-strong);
    cursor: pointer;
  }
  .option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option input {
    margin: 4px 0 0;
    accent-color: var(--accent);
    width: 18px;
    height: 18px;
  }
  .option .o-label {
    font-weight: 600;
  }
  .option .o-detail {
    grid-column: 2;
    color: var(--body);
    font-size: 0.9rem;
  }
  .rec {
    margin-left: 6px;
    font: 600 0.68rem var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
  }
  textarea {
    width: 100%;
    min-height: 2.4em;
    field-sizing: content;
    resize: vertical;
    border: 1px solid var(--hair-strong);
    padding: 8px 10px;
    background: var(--paper);
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .redraft-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 0.88rem;
  }
  .redraft-out {
    display: grid;
    gap: 8px;
  }
  .redraft-out:empty {
    display: none;
  }
  .pending {
    color: var(--body);
    font-size: 0.88rem;
  }

  /* groups */
  .group-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 12px;
    align-items: start;
  }
  .group-head > div {
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .switch input {
    appearance: none;
    width: 42px;
    height: 24px;
    background: var(--hair-strong);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    margin: 0;
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: var(--surface);
    transition: transform 0.15s;
  }
  .switch input:checked {
    background: var(--accent);
  }
  .switch input:checked::after {
    transform: translateX(18px);
  }
  .switch input:indeterminate {
    background: color-mix(in srgb, var(--accent) 45%, var(--hair-strong));
  }
  .switch input:indeterminate::after {
    transform: translateX(9px);
  }
  .items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    border-top: 1px solid var(--hair-strong);
  }
  .item {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 4px 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--hair-strong);
    align-items: start;
  }
