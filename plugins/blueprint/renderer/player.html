<style>
  body.player {
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--paper);
  }

  .screen,
  .controls {
    width: min(100%, var(--canvas-width));
  }

  .screen {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--hair-strong);
    cursor: pointer;
  }

  .screen > .canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform: scale(var(--fit, 1));
    transform-origin: top left;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .controls button {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: none;
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }

  .controls button:focus-visible,
  .controls input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls svg {
    display: block;
    width: 16px;
    height: 16px;
  }

  .controls [hidden] {
    display: none;
  }

  .controls input {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
  }

  .controls output {
    flex: none;
    font-variant-numeric: tabular-nums;
  }
</style>
<div class="screen"><!-- figure --></div>
<div class="controls">
  <button type="button" aria-label="Play">
    <span class="play"><i data-icon="play"></i></span>
    <span class="pause" hidden><i data-icon="pause"></i></span>
  </button>
  <input type="range" min="0" step="0.01" value="0" aria-label="Time" />
  <output>0:00</output>
</div>
<script>
  (() => {
    /*__PLAYER_SCRIPT__*/
  })();
</script>
