<style>
  body.player {
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--paper);
  }

  .screen,
  .controls {
    width: min(100%, var(--canvas-width));
  }

  .screen {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--hair-strong);
    cursor: pointer;
  }

  .screen > .canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform: scale(var(--fit, 1));
    transform-origin: top left;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .controls button {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: none;
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }

  .controls button:focus-visible,
  .controls input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls svg {
    display: block;
    width: 16px;
    height: 16px;
  }

  .controls [hidden] {
    display: none;
  }

  .controls input {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
  }

  .controls output {
    flex: none;
    font-variant-numeric: tabular-nums;
  }
</style>
<div class="screen"><!-- figure --></div>
<div class="controls">
  <button type="button" aria-label="Play">
    <span class="play"><i data-icon="play"></i></span>
    <span class="pause" hidden><i data-icon="pause"></i></span>
  </button>
  <input type="range" min="0" step="0.01" value="0" aria-label="Time" />
  <output>0:00</output>
</div>
<script>
  (() => {
    const screen = document.querySelector(".screen");
    const canvas = screen.querySelector(".canvas");
    const button = document.querySelector(".controls button");
    const scrubber = document.querySelector(".controls input");
    const clock = document.querySelector(".controls output");
    const { duration, poster, render } = window.walkthrough;

    // Paused, the player shows the poster: the first scene in full.
    let t = poster;
    let started = false;
    let playing = false;
    let last = 0;

    const time = (seconds) =>
      `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;

    const show = () => {
      render(t);
      scrubber.value = String(t);
      clock.textContent = `${time(t)} / ${time(duration)}`;
    };

    const setPlaying = (value) => {
      playing = value;
      button.setAttribute("aria-label", playing ? "Pause" : "Play");
      button.querySelector(".play").toggleAttribute("hidden", playing);
      button.querySelector(".pause").toggleAttribute("hidden", !playing);
    };

    const tick = (now) => {
      if (!playing) {
        return;
      }

      t = Math.min(duration, t + (now - last) / 1000);
      last = now;
      show();

      if (t >= duration) {
        setPlaying(false);
      } else {
        requestAnimationFrame(tick);
      }
    };

    const toggle = () => {
      setPlaying(!playing);

      if (!playing) {
        return;
      }

      if (!started || t >= duration) {
        t = 0;
        started = true;
      }

      last = performance.now();
      requestAnimationFrame(tick);
    };

    const fit = () => {
      screen.style.setProperty(
        "--fit",
        String(screen.clientWidth / canvas.offsetWidth),
      );
    };

    document.body.style.setProperty(
      "--canvas-width",
      `${canvas.offsetWidth}px`,
    );
    scrubber.max = String(duration);
    scrubber.addEventListener("input", () => {
      started = true;
      t = Number(scrubber.value);
      show();
    });
    button.addEventListener("click", toggle);
    screen.addEventListener("click", toggle);
    document.addEventListener("keydown", (event) => {
      if (event.key === " " && event.target === document.body) {
        event.preventDefault();
        toggle();
      }
    });
    new ResizeObserver(fit).observe(screen);

    fit();
    show();
  })();
</script>
