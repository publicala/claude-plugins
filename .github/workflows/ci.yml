# CI for a skill repo: Markdown, YAML and JSON, plus the TypeScript scripts
# that run on Bun (the bonsai page renderer and the plugin checks).
#
# Gate jobs feed a single `ci-success` aggregate. Make `ci-success` the required
# status check in branch protection, so adding or renaming a gate never touches
# the ruleset. Keep every gate in `ci-success`'s `needs:` list.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per ref. Superseded PR runs cancel for fast feedback. Runs on `main`
  # never cancel each other, so every commit gets a complete `ci-success`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The renderer runs on the user's machine, usually macOS, so the tests run
  # there too. bunfig.toml holds the coverage floor.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun test --coverage

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - name: Every tracked JSON parses
        run: |
          for json_file in $(git ls-files '*.json'); do
            bun -e "JSON.parse(await Bun.file('$json_file').text())" \
              || { echo "::error file=$json_file::invalid JSON"; exit 1; }
          done

  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - name: Relative links resolve and SKILL.md frontmatter is complete
        run: bun scripts/check-plugins.ts

  # The single status check branch protection requires on `main`. Runs even when
  # a gate fails or is skipped (if: !cancelled()), but not when the run is
  # cancelled, so a cancelled run reports as cancelled rather than failed.
  ci-success:
    if: ${{ !cancelled() }}
    needs: [format, lint, typecheck, test, validate-json, validate-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
