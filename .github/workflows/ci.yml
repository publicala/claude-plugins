# CI for a skill repo: Markdown, YAML and JSON, plus the TypeScript scripts
# that run on Bun.
#
# Gate jobs feed a single `ci-success` aggregate. Make `ci-success` the required
# status check in branch protection, so adding or renaming a gate never touches
# the ruleset. Keep every gate in `ci-success`'s `needs:` list.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per ref. Superseded PR runs cancel for fast feedback. Runs on `main`
  # never cancel each other, so every commit gets a complete `ci-success`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The renderer runs on the user's machine, usually macOS, so the tests run
  # there too.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # The renderer tests fail under CI when a tool they drive is missing.
      # The runner images ship Chrome. ffmpeg, for the walkthrough video, comes
      # from a static build pinned by sha256: seconds, where apt-get and brew
      # take most of a minute.
      - name: Install ffmpeg
        env:
          FFMPEG_RELEASE: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              asset=ffmpeg-linux-x64.gz
              sha256=bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
              ;;
            macOS-ARM64)
              asset=ffmpeg-darwin-arm64.gz
              sha256=8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa
              ;;
            *)
              echo "::error::No pinned ffmpeg build for $RUNNER_OS-$RUNNER_ARCH. Add its asset and sha256 from $FFMPEG_RELEASE."
              exit 1
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/ffmpeg/ffmpeg.gz" "$FFMPEG_RELEASE/$asset"
          echo "$sha256  $RUNNER_TEMP/ffmpeg/ffmpeg.gz" | shasum --algorithm 256 --check --strict
          gunzip "$RUNNER_TEMP/ffmpeg/ffmpeg.gz"
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -n 1
      - run: bun install --frozen-lockfile
      - run: bun test --coverage

  validate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Every JSON file parses
        run: bun run validate:json

  validate-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Links, skills, manifests and plugin paths hold
        run: bun run validate:plugins

  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Markdown prose follows the writing rules in CLAUDE.md
        run: bun run check:prose

  # Workflow syntax and expressions (actionlint), and the security audit of
  # the workflows and dependabot.yml (zizmor). Any finding fails the job.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          persona: regular
          # Report in the log and as annotations, and fail on any finding.
          # The SARIF upload would pass the job and needs security-events: write.
          advanced-security: false
          annotations: true

  # The single status check branch protection requires on `main`. Runs even when
  # a gate fails or is skipped (if: !cancelled()), but not when the run is
  # cancelled, so a cancelled run reports as cancelled rather than failed.
  ci-success:
    if: ${{ !cancelled() }}
    needs:
      [
        format,
        lint,
        typecheck,
        test,
        validate-json,
        validate-plugins,
        prose,
        actions,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
