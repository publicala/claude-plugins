version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # A lucide-static bump fails CI until `bun run update:icons` regenerates
      # plugins/blueprint/assets/icons.json, which Dependabot cannot run. Its
      # own PR keeps the rest of the group green. Run the command on its branch.
      # A dependency joins the first group it matches, so this one stays first.
      lucide-static:
        patterns: ["lucide-static"]
      npm:
        patterns: ["*"]
    # typescript-eslint rejects TypeScript 7. Drop this once it supports it:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /plugins/blueprint
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      blueprint:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
